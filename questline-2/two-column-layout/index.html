<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Column Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="column left">
      <h2>Column 1</h2>
      <p>This is the left side column using CSS Flexbox layout.</p>
    </div>
    <div class="column right">
      <h2>Column 2</h2>
      <p>This is the right side column using CSS Flexbox layout.</p>
    </div>
  </div>
</body>
</html>
